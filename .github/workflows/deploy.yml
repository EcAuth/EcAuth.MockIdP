name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同時デプロイを避ける（wrangler deploy は最後に成功したものが有効になるため）
concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # 以降のステップで Git 認証情報を使わないため保持しない
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      # Workers Secret（テナント設定・署名鍵）はデプロイでは上書きされないため、
      # このワークフローでは投入しない。値を変更したいときは README の
      # 「シークレットの投入」の手順をローカルから実行する。
      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9._-]+\.workers\.dev' deploy.log | head -1)"
          if [ -z "$url" ]; then
            echo "workers.dev URL could not be determined from deploy output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            if curl -sf "${WORKER_URL}/healthz" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1
