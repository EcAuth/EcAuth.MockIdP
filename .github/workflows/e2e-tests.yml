name: Playwright E2E Tests - MockOpenIdProvider

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # wrangler dev はローカル (Miniflare) で動くため Cloudflare の認証は不要。
      MOCK_IDP_BASE_URL: http://127.0.0.1:8787
      CLIENT_ID: mockclientid
      CLIENT_SECRET: mock-client-secret
      REDIRECT_URI: https://localhost:8081/v1/auth/callback
      TEST_USER_EMAIL: defaultuser@example.com
      TEST_USER_PASSWORD: password
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 以降のステップで Git 認証情報を使わないため保持しない
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # pnpm ワークスペースなので、ルートで 1 回入れれば e2e-tests の依存も揃う
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .dev.vars.example はローカル専用のテスト値のみを含むため、
      # そのままローカル実行用の設定として使える。
      - name: Prepare local bindings
        run: cp .dev.vars.example .dev.vars

      - name: Start Worker (wrangler dev)
        run: |
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 > wrangler-dev.log 2>&1 &
          echo $! > wrangler.pid

      - name: Wait for Worker to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${MOCK_IDP_BASE_URL}/healthz" >/dev/null; then
              echo "Worker is ready"
              exit 0
            fi
            echo "Waiting for Worker to start... ($i/30)"
            sleep 2
          done
          echo "Worker did not become ready"
          cat wrangler-dev.log
          exit 1

      - name: Install Playwright browsers
        working-directory: e2e-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: e2e-tests
        run: pnpm exec playwright test

      - name: Display Worker logs
        if: failure()
        run: cat wrangler-dev.log || echo "No logs found"

      - name: Stop Worker
        if: always()
        run: kill "$(cat wrangler.pid)" || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: 'e2e-tests/test-results/'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: 'e2e-tests/playwright-report/'
