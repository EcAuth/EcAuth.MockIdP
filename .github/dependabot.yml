version: 2
updates:
  # GitHub Actions の自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    # minor/patch と major の 2 PR に集約する。
    # patterns を "*" にしているのは、公式 actions/* 以外のサードパーティ
    # （docker/* anthropics/* pnpm/* azure/* 等）を取りこぼさないため。
    # docker/* は major 更新が同時に来ることが多く（build-push/login/metadata/
    # setup-buildx）、ベンダー別 group + minor/patch 限定では個別 PR に散る。
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # .NET NuGet パッケージの自動更新
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src/MockOpenIdProvider"
      - "/tests/MockOpenIdProvider.Test"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dotnet"
    commit-message:
      prefix: "chore"
      include: "scope"
    allow:
      - dependency-type: "all"
    # group を指定すると複数 directories の同一パッケージ更新が 1 PR に集約される
    groups:
      nuget-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # .NET ランタイム同梱パッケージの major 更新は、.NET 本体のメジャー移行と
    # 同時に IdpUtilities → MockIdP → EcAuth の順で進める必要があるため止める。
    # 手順は EcAuthDocs の claude-repository-guide.md
    # 「.NET メジャーバージョン移行の順序（標準手順）」を参照。
    ignore:
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  # E2E Tests の npm パッケージの自動更新
  - package-ecosystem: "npm"
    directory: "/e2e-tests"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "e2e-tests"
    commit-message:
      prefix: "chore"
      include: "scope"
    # 開発依存関係も含める
    allow:
      - dependency-type: "all"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
